# Nixpacks Build Plan for Railway - Simplified
# Build: install deps, generate client, compile
# Deploy: verify migrations (DATABASE_URL available)
# Start: run server

[phases.setup]
nixPkgs = ["nodejs_20", "postgresql", "redis"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run prisma:generate", "npm run build"]

[phases.deploy]
# DATABASE_URL is available at deploy time
cmds = ["./node_modules/.bin/prisma migrate status"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"