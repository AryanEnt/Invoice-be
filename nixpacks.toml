# Nixpacks Build Plan for Railway - Minimal
# Build: install deps, generate client, compile
# Start: verify migrations, then run server

[phases.setup]
nixPkgs = ["nodejs_20", "postgresql", "redis"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run prisma:generate", "npm run build"]

[start]
# Verify migrations, then start server
cmd = "./node_modules/.bin/prisma migrate status && npm run start"

[variables]
NODE_ENV = "production"