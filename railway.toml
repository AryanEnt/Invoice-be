# Railway Deployment Configuration
# Defines how Railway builds, deploys, and monitors this service.
# Using Nixpacks ensures reproducible builds with pinned Node.js version.

[build]
# Nixpacks provides deterministic builds and automatic dependency caching.
# This is more reliable than Dockerfiles for Node.js projects.
builder = "nixpacks"

[deploy]
# Health checks prevent traffic from routing to unhealthy instances.
# The /api/health endpoint validates database and Redis connectivity.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
# Automatic restart on failure improves availability without manual intervention.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Run database migrations before launching the application
preDeployCommand = "npx prisma migrate deploy"

# Production entry point runs the compiled TypeScript output.
# The build step (npm run build) must complete successfully first.
startCommand = "npm run start"

# Build command defaults to npm run build via Nixpacks detection.
# Override only if you need custom build steps.
# buildCommand = "npm run build"